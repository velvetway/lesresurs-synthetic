# Формализованные нормативы для расчёта сил и средств.
# Каждое правило имеет ссылку на нормативный правовой акт (НПА).
# Значения с пометкой source: calibration получены по реестру лесных пожаров 2016–2025
# (рабочие данные проекта) и подлежат уточнению по экспертным данным Авиалесоохраны/ВНИИЛМ.

acts:
  r1605:
    title: "Распоряжение Правительства РФ от 19.07.2019 № 1605-р (ред. от 03.11.2023 № 3096-р)"
    short: "Распоряжение № 1605-р"
  p244:
    title: "Приказ Минприроды России от 01.04.2022 № 244 «Об утверждении Правил тушения лесных пожаров»"
    short: "Приказ № 244"
  p287:
    title: "Приказ Рослесхоза от 05.07.2011 № 287 «Об утверждении классификации природной пожарной опасности лесов и классификации пожарной опасности в лесах в зависимости от условий погоды»"
    short: "Приказ № 287"
  p566:
    title: "Приказ Рослесхоза от 06.05.2022 № 566 «Об утверждении методики расчёта показателя „Ущерб лесным насаждениям от лесных пожаров“»"
    short: "Приказ № 566"
  fz248:
    title: "Федеральный закон от 31.07.2020 № 248-ФЗ «О государственном контроле (надзоре) и муниципальном контроле в РФ», ст. 23 (категории риска)"
    short: "248-ФЗ, ст. 23"

group:
  size: 6               # человек в типовой группе
  size_min: 4
  size_max: 10
  ref: {act: r1605, point: "табл. 1, примечания <1>, <2>"}

# Время прибытия наземных сил с момента возникновения пожара (п. 51 Правил тушения)
arrival_limit_h:
  by_natural_class: {1: 1, 2: 2, 3: 3, 4: 3, 5: 3}
  ref: {act: p244, point: "п. 51"}

# Усиление при сложной метеообстановке (п. 52 Правил тушения)
reinforcement:
  wind_ms_over: 5
  weather_class_min: 4
  natural_classes: [1, 2, 3]
  time_factor: 0.5      # предельное время сокращается в 2 раза
  force_factor: 2       # либо силы увеличиваются в 2 раза
  ref: {act: p244, point: "п. 52"}

# Классы пожарной опасности по условиям погоды (комплексный показатель Нестерова)
weather_class:
  thresholds: [300, 1000, 4000, 10000]   # I: 0–300, II: 301–1000, III: 1001–4000, IV: 4001–10000, V: >10000
  ref: {act: p287, point: "приложение 2, таблица"}

# Природная пожарная опасность по преобладающей породе (упрощённо, приложение 1)
natural_class_by_species:
  Сосна: 2
  Лиственница: 2
  Кедр: 3
  Ель: 4
  Пихта: 4
  Дуб: 3
  Береза: 4
  Осина: 4
  Липа: 4
  Ясень: 4
  Ольха: 5
  default: 3
  ref: {act: p287, point: "приложение 1"}

# Скорость распространения кромки (м/ч) — исходные значения, source: literature + calibration
spread:
  head_ros_m_h_by_weather_class: {1: 5, 2: 12, 3: 25, 4: 45, 5: 70}
  wind_coef: 0.18          # множитель exp(wind_coef * ветер, м/с)
  crown_multiplier: 5
  perimeter_to_head: 1.5   # прирост периметра относительно скорости фронта (эллипс)
  localization_horizon_h: 6  # горизонт, за который нужно окружить текущий периметр
  ref: {act: p244, point: "п. 50 (учёт силы и скорости распространения)"}

# Производительность одной группы по локализации кромки, м/ч (медиана по реестру НСС 2016–2025)
productivity_m_h_per_group:
  value: 130
  q25: 60
  q75: 260
  source: calibration

# Техника, требуемая под группы (типовой состав ЛПС по 1605-р)
vehicles:
  АЦЛ:
    name: "автоцистерна лесопожарная"
    rule: "1 на каждые 2 группы, не менее 1"
    ref: {act: r1605, point: "табл. 2, примечание <8>"}
  ТЛП:
    name: "трактор лесопожарный"
    rule: "1 при площади ≥ 2 га или верховом пожаре (прокладка минерализованных полос); 2 при площади ≥ 25 га"
    ref: {act: p244, point: "пп. 59, 62"}
  ВЛП:
    name: "вездеход лесопожарный"
    rule: "1 при удалённости от населённого пункта > 10 км (труднодоступный участок)"
    ref: {act: r1605, point: "табл. 2, примечание <10>"}
  АГП1:
    name: "автомобиль грузопассажирский"
    rule: "1 на группу сверх вместимости АЦЛ"
    ref: {act: r1605, point: "табл. 2, примечание <13>"}
  ТБ:
    name: "бульдозер"
    rule: "1 при площади ≥ 25 га или верховом пожаре (заградительные полосы шириной до 9 м)"
    ref: {act: p244, point: "пп. 62, 63"}

# Типовой состав лесопожарных станций (1605-р, примечания <8>–<14>)
station_types:
  ЛПС-1: {groups: 2, АЦЛ: 1, ТЛП: 0, ВЛП: 0, ТБ: 0, АГП1: 1, АГ2: 1}
  ЛПС-2: {groups: 3, АЦЛ: 2, ТЛП: 1, ВЛП: 1, ТБ: 1, АГП1: 1, АГ2: 2}
  ЛПС-3: {groups: 4, АЦЛ: 4, ТЛП: 2, ВЛП: 2, ТБ: 1, АГП1: 2, АГ2: 3}

# Нормативы обеспеченности субъектов (1605-р, табл. 1 и 2).
# station_composition — состав станций модельного субъекта. Суммы групп и техники намеренно
# ниже норматива (обеспеченность ≈55–60 %): модельные субъекты воспроизводят характерный для
# реальных районов дефицит сил, из-за которого и возникает задача межрайонного маневрирования.
region_norms:
  Северотаёжный модельный край:
    groups: 60
    people: 360
    ground_firefighters: 240
    stations_total: 9
    ЛПС-1: 6
    ЛПС-2: 2
    ЛПС-3: 1
    aviation_units: 7
    АЦЛ: 28
    ТЛП: 8
    ВЛП: 4
    ТБ: 6
    station_composition:
      ЛПС-1: {groups: 2, АЦЛ: 1, ТЛП: 0, ВЛП: 0, ТБ: 0, АГП1: 1}
      ЛПС-2: {groups: 3, АЦЛ: 2, ТЛП: 1, ВЛП: 1, ТБ: 1, АГП1: 1}
      ЛПС-3: {groups: 4, АЦЛ: 4, ТЛП: 2, ВЛП: 2, ТБ: 1, АГП1: 2}
    ref: {act: r1605, point: "табл. 1, 2"}
  Лесостепная модельная область:
    groups: 35
    people: 210
    ground_firefighters: 210
    stations_total: 12
    ЛПС-1: 8
    ЛПС-2: 0
    ЛПС-3: 4
    aviation_units: 0
    АЦЛ: 36
    ТЛП: 18
    ВЛП: 0
    ТБ: 6
    station_composition:
      ЛПС-1: {groups: 1, АЦЛ: 1, ТЛП: 0, ВЛП: 0, ТБ: 0, АГП1: 1}
      ЛПС-3: {groups: 4, АЦЛ: 4, ТЛП: 3, ВЛП: 0, ТБ: 1, АГП1: 2}
    ref: {act: r1605, point: "табл. 1, 2"}

# Категории риска: матрица 3×3 «тяжесть × вероятность разрастания»
risk:
  severity:
    high:   {np_km_max: 5,  oopt_km_max: 10, crown: true}
    medium: {np_km_max: 10, oopt_km_max: 20}
  probability:
    # ось вероятности: вероятность разрастания ≥ 25 га от ML-модели + метеоусловия
    high:   {p_min: 0.30, wind_ms_min: 8, weather_class_min: 5}
    medium: {p_min: 0.15, wind_ms_min: 5, weather_class_min: 4}
  matrix:   # [тяжесть][вероятность]
    low:    {low: низкий, medium: средний, high: значительный}
    medium: {low: средний, medium: значительный, high: высокий}
    high:   {low: значительный, medium: высокий, high: чрезвычайно высокий}
  weights: {низкий: 1, средний: 2, значительный: 4, высокий: 8, "чрезвычайно высокий": 16}
  ref: {act: fz248, point: "ст. 23"}

# Ущерб: медианы по реестру 2025 г. (графа «Ущерб», включает затраты на тушение), методика — приказ № 566
damage:
  per_ha_rub: 29900
  small_fire_rub: 47059     # медиана ущерба (вкл. затраты на тушение), пожары < 25 га, районы НСС, реестр 2025 (n=4432)
  large_fire_rub: 370172    # то же, пожары ≥ 25 га
  unserved_delay_h: 8       # задержка, принимаемая для пожара без назначенных сил
  ref: {act: p566, point: "п. 7–8"}
  source: calibration
